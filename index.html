<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>For my BABY 💜</title>


<style>
  :root{
    --plum: #1c1023;
    --aubergine: #2f1a3d;
    --violet: #6d3b8f;
    --orchid: #9b5de5;
    --lilac: #c9a0f5;
    --petal: #e8b4d8;
    --gold: #f2c568;
    --paper: #fbf6ec;
    --ink: #3a2a4a;
  }

  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Caveat:wght@500;600;700&family=Nunito+Sans:wght@300;400;600&display=swap');

  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ scroll-behavior: smooth; }

  body{
    font-family: 'Nunito Sans', sans-serif;
    background: var(--plum);
    color: var(--paper);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  
  .aurora{
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse 60% 45% at 15% 20%, rgba(155,93,229,0.35), transparent 60%),
      radial-gradient(ellipse 50% 40% at 85% 15%, rgba(232,180,216,0.25), transparent 60%),
      radial-gradient(ellipse 70% 50% at 50% 90%, rgba(109,59,143,0.4), transparent 65%),
      var(--plum);
    filter: blur(0px);
  }

  /* drifting petals — replaces generic floating-heart-emoji look */
  .petal-field{ position: fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .petal{
    position: absolute;
    top: -5%;
    width: 14px; height: 18px;
    background: linear-gradient(160deg, var(--petal), var(--orchid));
    border-radius: 100% 0 100% 0;
    opacity: 0.55;
    animation: drift linear infinite;
  }
  @keyframes drift{
    0%{ transform: translateY(-10vh) translateX(0) rotate(0deg); }
    50%{ transform: translateY(55vh) translateX(30px) rotate(160deg); }
    100%{ transform: translateY(115vh) translateX(-20px) rotate(320deg); }
  }

  section{
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 6vh 6vw;
    text-align: center;
  }

  /* ---------------- floating mute control ---------------- */
  #muteBtn{
    position: fixed;
    bottom: 22px; right: 22px;
    z-index: 50;
    width: 46px; height: 46px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(20,10,26,0.6);
    backdrop-filter: blur(6px);
    color: var(--paper);
    font-size: 1.1rem;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
  }

  /* ================= SECTION 1: the question ================= */
  #ask .teaser{
    font-family: 'Caveat', cursive;
    font-size: 1.5rem;
    color: var(--lilac);
    min-height: 2.4rem;
    margin-bottom: 0.6rem;
  }
  #ask .teaser .cursor{ opacity: 0.6; animation: blink 1s step-start infinite; }
  @keyframes blink{ 50%{ opacity:0; } }

  #ask h1{
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 600;
    font-style: italic;
    font-size: clamp(2rem, 6.5vw, 3.6rem);
    line-height: 1.2;
    max-width: 20ch;
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  #ask h1.show{ opacity: 1; transform: translateY(0); }

  .button-row{
    margin-top: 3.2rem;
    display: flex;
    gap: 1.4rem;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.6s ease 0.3s;
  }
  .button-row.show{ opacity: 1; }

  .btn{
    border: none;
    border-radius: 999px;
    padding: 0.95rem 2.5rem;
    font-family: 'Nunito Sans', sans-serif;
    font-weight: 600;
    font-size: 1.05rem;
    cursor: pointer;
    box-shadow: 0 10px 26px rgba(0,0,0,0.3);
    transition: transform 0.25s cubic-bezier(.34,1.56,.64,1);
  }
  .btn-yes{
    background: linear-gradient(135deg, var(--gold), #e8b4d8);
    color: #3a1030;
  }
  .btn-no{
    background: rgba(255,255,255,0.1);
    color: var(--paper);
    border: 1.5px solid rgba(255,255,255,0.35);
  }
  /* once she starts dodging it, it becomes fixed to roam the whole screen */
  .btn-no.roaming{
    position: fixed;
    z-index: 40;
    transition: top 0.35s cubic-bezier(.22,1,.36,1), left 0.35s cubic-bezier(.22,1,.36,1), transform 0.3s ease;
  }

  #reaction-line{
    margin-top: 1.6rem;
    font-family: 'Caveat', cursive;
    font-size: 1.35rem;
    color: var(--petal);
    min-height: 1.7rem;
  }

  /* full-screen heart-draw + gif moment on YES */
  #yes-moment{
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(20,10,30,0.92);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 1.4rem;
    text-align: center;
    padding: 2rem;
  }
  #yes-moment.active{ display: flex; }
  #heartSvg{ width: 160px; height: 160px; }
  #heartSvg path{
    fill: none;
    stroke: var(--petal);
    stroke-width: 4;
    stroke-linecap: round;
    stroke-dasharray: 340;
    stroke-dashoffset: 340;
    animation: drawHeart 1.1s ease forwards, fillHeart 0.5s ease forwards 1.1s;
  }
  @keyframes drawHeart{ to{ stroke-dashoffset: 0; } }
  @keyframes fillHeart{ to{ fill: var(--petal); } }
  #yes-moment .reaction-gif{
    max-width: min(70vw, 300px);
    border-radius: 16px;
    opacity: 0;
    transform: scale(0.85);
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    animation: popIn 0.5s ease forwards 1.5s;
  }
  @keyframes popIn{ to{ opacity:1; transform:scale(1); } }
  #yes-moment .yes-caption{
    font-family: 'Caveat', cursive;
    font-size: 1.6rem;
    color: var(--lilac);
    opacity: 0;
    animation: popIn 0.5s ease forwards 1.9s;
  }
  #yes-moment .tap-hint{
    font-family: 'Nunito Sans', sans-serif;
    font-size: 0.85rem;
    letter-spacing: 0.5px;
    color: rgba(251,246,236,0.55);
    opacity: 0;
    animation: popIn 0.5s ease forwards 2.4s;
  }

  /* ================= SECTION 2: envelope ================= */
  #envelope-stage h2{
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(1.5rem, 4.5vw, 2.2rem);
    margin-bottom: 2.4rem;
  }
  .envelope{
    width: min(85vw, 320px);
    height: 210px;
    position: relative;
    cursor: pointer;
    filter: drop-shadow(0 20px 40px rgba(0,0,0,0.4));
    transition: transform 0.2s ease;
  }
  .envelope:hover{ transform: translateY(-4px); }
  .env-body{ position:absolute; inset:0; background:var(--paper); border-radius:10px; }
  .env-flap{
    position:absolute; top:0; left:0; right:0; height:50%;
    background: var(--lilac);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top;
    transition: transform 0.6s ease;
    border-radius:10px 10px 0 0;
  }
  .env-seal{
    position:absolute; top:42%; left:50%; transform:translate(-50%,-50%);
    width:44px; height:44px; background:var(--gold); border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:1.2rem;
    box-shadow:0 4px 10px rgba(0,0,0,0.3);
    transition:opacity 0.3s ease;
  }
  .envelope.open .env-flap{ transform: rotateX(180deg); }
  .envelope.open .env-seal{ opacity: 0; }
  .env-hint{ margin-top:1.3rem; font-family:'Caveat', cursive; font-size:1.15rem; color:var(--lilac); }

  /* ================= SECTION 3: the letter ================= */
  #letter{
    background: linear-gradient(170deg, #f3e8fb, var(--paper));
    color: var(--ink);
  }
  .letter-card{
    max-width: 620px;
    background: var(--paper);
    border-radius: 3px;
    padding: 3rem clamp(1.4rem, 6vw, 3.6rem);
    box-shadow: 0 30px 60px rgba(30,15,40,0.4);
    position: relative;
  }
  .letter-card::before{
    content:''; position:absolute; top:13px; left:13px; right:13px; bottom:13px;
    border:1px solid rgba(155,93,229,0.25); pointer-events:none;
  }
  .letter-heading{ font-family:'Caveat', cursive; font-size:2rem; color:var(--orchid); margin-bottom:1.1rem; }
  .letter-body{
    font-family:'Caveat', cursive; font-size:1.4rem; line-height:1.55;
    color:var(--ink); text-align:left; white-space:pre-line;
  }
  .letter-sign{ margin-top:1.6rem; font-family:'Caveat', cursive; font-size:1.5rem; text-align:right; color:var(--orchid); }

  /* ================= SECTION 4: photo ================= */
  #photo{ background: linear-gradient(170deg, var(--aubergine), var(--plum)); }
  #photo h2{ font-family:'Fraunces', serif; font-style:italic; font-weight:500; font-size:clamp(1.5rem, 4.5vw, 2.2rem); margin-bottom:2rem; }
  .polaroid{
    background: var(--paper);
    padding: 1rem 1rem 3rem 1rem;
    border-radius: 3px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.45);
    transform: rotate(-3deg);
    max-width: min(78vw, 360px);
  }
  .polaroid img{ width:100%; display:block; border-radius:2px; aspect-ratio:4/5; object-fit:cover; background:linear-gradient(135deg,var(--lilac),var(--petal)); }
  .polaroid figcaption{ font-family:'Caveat', cursive; font-size:1.25rem; color:var(--ink); margin-top:0.7rem; }

  /* ================= SECTION 5: song ================= */
  #song{ background: linear-gradient(170deg, var(--plum), #120a19); }
  #song h2{ font-family:'Fraunces', serif; font-style:italic; font-weight:500; font-size:clamp(1.5rem,4.5vw,2.2rem); margin-bottom:0.5rem; }
  #song p.sub{ font-family:'Caveat', cursive; font-size:1.25rem; color:var(--lilac); margin-bottom:2.4rem; }
  .vinyl-card{
    display:flex; align-items:center; gap:1.5rem;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px;
    padding: 1.3rem 1.7rem;
    max-width: 420px; width: 90vw;
  }
  .vinyl{
    width:66px; height:66px; border-radius:50%; flex-shrink:0;
    background: radial-gradient(circle at center, var(--gold) 0 8%, #111 9% 60%, #333 61% 100%);
    animation: spin 4s linear infinite paused;
  }
  .vinyl.spinning{ animation-play-state: running; }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  .song-info{ text-align:left; flex:1; }
  .song-title{ font-weight:600; font-size:1rem; }
  .song-artist{ font-size:0.82rem; color:var(--lilac); margin-bottom:0.55rem; }
  audio{ width:100%; }
  #song .footer-note{ margin-top:2.8rem; font-family:'Caveat', cursive; font-size:1.35rem; color:var(--petal); }

  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
</style>
</head>
<body>

<div class="aurora"></div>
<div class="petal-field" id="petalField"></div>
<button id="muteBtn" title="mute/unmute background music">🔊</button>

<!-- ============ SECTION 1: THE QUESTION ============ -->
<section id="ask">
  <div class="teaser" id="teaser"><span></span><span class="cursor">|</span></div>
  <h1 id="question"></h1>
  <div class="button-row" id="buttonRow">
    <button class="btn btn-yes" id="yesBtn">Yes 💜</button>
    <button class="btn btn-no" id="noBtn">No</button>
  </div>
  <div id="reaction-line"></div>
</section>

<!-- full screen yes moment -->
<div id="yes-moment">
  <svg id="heartSvg" viewBox="0 0 100 90">
    <path d="M50 82 C 20 60, 2 40, 2 22 C 2 6, 18 -2, 32 6 C 40 11, 46 18, 50 26 C 54 18, 60 11, 68 6 C 82 -2, 98 6, 98 22 C 98 40, 80 60, 50 82 Z"/>
  </svg>
  <img class="reaction-gif" id="reactionGif" alt="">
  <div class="yes-caption" id="yesCaption"></div>
  <div class="tap-hint" id="tapHint">tap anywhere to continue</div>
</div>

<!-- ============ SECTION 2: ENVELOPE ============ -->
<section id="envelope-stage">
  <h2>I have something for you.</h2>
  <div class="envelope" id="envelope">
    <div class="env-body"></div>
    <div class="env-flap"></div>
    <div class="env-seal">💜</div>
  </div>
  <div class="env-hint">tap the envelope to open it</div>
</section>

<!-- ============ SECTION 3: THE LETTER ============ -->
<section id="letter">
  <div class="letter-card">
    <div class="letter-heading" id="letterHeading">To my favorite person,</div>
    <div class="letter-body" id="letterBody"></div>
    <div class="letter-sign" id="letterSign">— always yours 💜</div>
  </div>
</section>

<!-- ============ SECTION 4: PHOTO ============ -->
<section id="photo">
  <h2>My favorite picture of us</h2>
  <figure class="polaroid">
    <img id="ourPhoto" alt="Us together"
      onerror="this.alt='📷 add your photo file — see CONFIG.photo in the script';">
    <figcaption id="photoCaption"> us, alway💜</figcaption>
  </figure>
</section>

<!-- ============ SECTION 5: SONG ============ -->
<section id="song">
  <h2>Song dedicated to you</h2>
  <p class="sub">press play, close your eyes</p>
  <div class="vinyl-card">
    <div class="vinyl" id="vinyl"></div>
    <div class="song-info">
      <div class="song-title" id="songTitle">Song Title Here</div>
      <div class="song-artist" id="songArtist">Artist Name</div>
      <audio id="audio" controls></audio>
    </div>
  </div>
  <div class="footer-note" id="finalNote"></div>
</section>

<script>
/* =========================================================
   CONFIG — edit everything here, nothing else needs to change
========================================================= */
const CONFIG = {
  herName: "Baby",                 // used nowhere visible right now, kept for your own reference
  teaserLines: [
    "Hello baby,",
    "before you scroll any further...",
    "I need to ask you something."
  ],
  question: "Do you still like me as much as I like you?",
  reactionPhrases: [
    "hindi kita hahayaang mag-'no' 😤",
    "the universe already said yes 💜",
    "try mo pa 😏",
    "sisiw lang 'to sayo",
    "sayang effort mo diyan hehe",
    "okay na okay, wag ka nang mahirapan 😭"
  ],
  yesCaption: "I knew it (love love kita super duper) 💜",

  photo: "us.png",
  photoCaption: "us, always 💜",

  letterHeading: "To my favorite person,",
  letterBody: `Happy August 1st, baby.

  I just want you to know how much you mean to me. Every single day with you feels lighter, even the ordinary ones, just because you're in it. You have this way of making the simplest moments feel special, and I don't think you even realize how much that means to me.

Thank you for staying, for loving me, and for taking care of me even in the little ways. I'm so grateful to have you in my life. You've had such a big impact on me, and you've changed me in so many good ways. I love you more than words can express, and I hope you feel that every single day.

I know things aren't always easy, may mga araw na mahirap, may mga gulo minsan, pero I want you to know na hindi 'yon nagbabago sa kung gaano kita kamahal. If anything, lalo lang lumalalim ang pagmamahal ko sayo sa bawat araw na tayo.

I'll always be your safe place, someone you can lean on, the one who makes you laugh, and the reason you'll never feel alone. Whatever you're going through, you're never facing it by yourself, kasi nandito ako, and I will always be here for you.

Here's to more months, more memories, and more us. Sana patuloy lang tayong lumago, patuloy tayong sumuporta sa isa't isa, and patuloy tayong mahalin ang isa't isa.

Also — goodluck sa class mo, my future engineer! Alam kong hindi magiging madali ang path, pero naniniwala ako na kaya mo 'yan, at proud na proud ako sayo, always. I love you so much, baby.`,
  letterSign: "— your poging boyfriend(husband) jeyel 💜",

  ourSongFile: "song.mp3",
  ourSongTitle: "Someday",
  ourSongArtist: "The Ridleys",

  bgMusicFile: "bgmusic.mp3",   // plays automatically the moment she taps Yes
  yesGif: "yesreaction.gif",     // shown right after she taps Yes

  finalNote: " I love you so much, baby 💜"
};

/* =========================================================
   Wire up CONFIG to the page
========================================================= */
document.getElementById('question').textContent = CONFIG.question;
document.getElementById('letterHeading').textContent = CONFIG.letterHeading;
document.getElementById('letterBody').textContent = CONFIG.letterBody;
document.getElementById('letterSign').textContent = CONFIG.letterSign;
document.getElementById('ourPhoto').src = CONFIG.photo;
document.getElementById('photoCaption').textContent = CONFIG.photoCaption;
document.getElementById('songTitle').textContent = CONFIG.ourSongTitle;
document.getElementById('songArtist').textContent = CONFIG.ourSongArtist;
document.getElementById('audio').src = CONFIG.ourSongFile;
document.getElementById('finalNote').textContent = CONFIG.finalNote;
document.getElementById('reactionGif').src = CONFIG.yesGif;
document.getElementById('yesCaption').textContent = CONFIG.yesCaption;

/* =========================================================
   Petal field (ambient, replaces generic floating hearts)
========================================================= */
const petalField = document.getElementById('petalField');
for(let i=0;i<16;i++){
  const p = document.createElement('div');
  p.className = 'petal';
  p.style.left = Math.random()*100+'vw';
  p.style.width = p.style.height = (10 + Math.random()*10)+'px';
  p.style.animationDuration = (9 + Math.random()*9)+'s';
  p.style.animationDelay = (Math.random()*12)+'s';
  p.style.opacity = 0.3 + Math.random()*0.4;
  petalField.appendChild(p);
}

/* =========================================================
   Teaser typewriter, then reveal the question
========================================================= */
const teaserSpan = document.querySelector('#teaser span');
const questionEl = document.getElementById('question');
const buttonRow = document.getElementById('buttonRow');
let lineIndex = 0, charIndex = 0;

function typeNextLine(){
  if(lineIndex >= CONFIG.teaserLines.length){
    questionEl.classList.add('show');
    buttonRow.classList.add('show');
    return;
  }
  const line = CONFIG.teaserLines[lineIndex];
  if(charIndex <= line.length){
    teaserSpan.textContent = line.slice(0, charIndex);
    charIndex++;
    setTimeout(typeNextLine, 35);
  } else {
    setTimeout(() => {
      lineIndex++;
      charIndex = 0;
      setTimeout(typeNextLine, 250);
    }, 700);
  }
}
setTimeout(typeNextLine, 500);

/* =========================================================
   The "No" button — roams the ENTIRE screen once she tries
   to interact with it, works on both mouse and touch/mobile
========================================================= */
const noBtn = document.getElementById('noBtn');
const yesBtn = document.getElementById('yesBtn');
const reactionLine = document.getElementById('reaction-line');
let dodgeCount = 0;
const MAX_DODGE_SCALE = 6;

function teleportNo(){
  noBtn.classList.add('roaming');
  const pad = 24;
  const w = noBtn.offsetWidth, h = noBtn.offsetHeight;
  const maxX = window.innerWidth - w - pad*2;
  const maxY = window.innerHeight - h - pad*2;
  const x = pad + Math.random()*Math.max(maxX,0);
  const y = pad + Math.random()*Math.max(maxY,0);
  noBtn.style.left = x+'px';
  noBtn.style.top = y+'px';

  dodgeCount = Math.min(dodgeCount+1, MAX_DODGE_SCALE);
  const noScale = Math.max(1 - dodgeCount*0.11, 0.45);
  const yesScale = Math.min(1 + dodgeCount*0.09, 1.7);
  noBtn.style.transform = `scale(${noScale})`;
  yesBtn.style.transform = `scale(${yesScale})`;

  reactionLine.textContent = CONFIG.reactionPhrases[(dodgeCount-1) % CONFIG.reactionPhrases.length];
}

// desktop: dodge as soon as the cursor gets close, not just on exact hover
document.addEventListener('mousemove', (e) => {
  if(!noBtn.classList.contains('roaming')) return;
  const r = noBtn.getBoundingClientRect();
  const cx = r.left + r.width/2, cy = r.top + r.height/2;
  const dist = Math.hypot(e.clientX-cx, e.clientY-cy);
  if(dist < 90) teleportNo();
});
noBtn.addEventListener('mouseenter', teleportNo);
noBtn.addEventListener('click', (e) => { e.preventDefault(); teleportNo(); });

// mobile: first tap anywhere near it teleports it, and it also
// jumps away as soon as a touch starts moving nearby
noBtn.addEventListener('touchstart', (e) => { e.preventDefault(); teleportNo(); }, {passive:false});
document.addEventListener('touchmove', (e) => {
  if(!noBtn.classList.contains('roaming')) return;
  const t = e.touches[0];
  const r = noBtn.getBoundingClientRect();
  const cx = r.left + r.width/2, cy = r.top + r.height/2;
  const dist = Math.hypot(t.clientX-cx, t.clientY-cy);
  if(dist < 70) teleportNo();
}, {passive:true});

/* =========================================================
   YES — heart draw animation, gif, auto-play bg music.
   She now taps/clicks anywhere on the screen when she's
   ready to continue, instead of it auto-advancing.
========================================================= */
const bgMusic = new Audio(CONFIG.bgMusicFile);
bgMusic.loop = true;
bgMusic.volume = 0.55;
const muteBtn = document.getElementById('muteBtn');
const yesMoment = document.getElementById('yes-moment');
const tapHint = document.getElementById('tapHint');
let canAdvance = false;

yesBtn.addEventListener('click', () => {
  canAdvance = false;
  yesMoment.classList.add('active');
  bgMusic.currentTime = 0;
  bgMusic.play().then(() => { muteBtn.style.display = 'flex'; }).catch(()=>{});

  // only allow moving on once the heart + gif + hint have fully
  // played out, so she has time to actually see everything
  setTimeout(() => { canAdvance = true; }, 2900);
});

yesMoment.addEventListener('click', () => {
  if(!canAdvance) return;
  yesMoment.classList.remove('active');
  document.getElementById('envelope-stage').scrollIntoView({behavior:'smooth'});
});

muteBtn.addEventListener('click', () => {
  bgMusic.muted = !bgMusic.muted;
  muteBtn.textContent = bgMusic.muted ? '🔇' : '🔊';
});

// pause the background music once she reaches the dedicated song
// player, so the two tracks don't play over each other
const songSection = document.getElementById('song');
const audioEl = document.getElementById('audio');
const io = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if(entry.isIntersecting && !bgMusic.paused){
      bgMusic.pause();
    }
  });
}, {threshold: 0.5});
io.observe(songSection);

/* =========================================================
   Envelope open
========================================================= */
const envelope = document.getElementById('envelope');
envelope.addEventListener('click', () => {
  envelope.classList.add('open');
  setTimeout(() => {
    document.getElementById('letter').scrollIntoView({behavior:'smooth'});
  }, 700);
});

/* =========================================================
   Vinyl spin follows audio playback
========================================================= */
const vinyl = document.getElementById('vinyl');
audioEl.addEventListener('play', () => vinyl.classList.add('spinning'));
audioEl.addEventListener('pause', () => vinyl.classList.remove('spinning'));
</script>

</body>
